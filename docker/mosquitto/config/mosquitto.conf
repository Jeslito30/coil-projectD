# Project D - Mosquitto configuration (MQTT over TLS, per-sensor accounts, topic ACL).
# Paths are container paths (eclipse-mosquitto image): config, certs and data are mounted under /mosquitto/.
# Contract: documents/data-design.md (sections 4 and 8), documents/vpn-plan.md (section 3).

# --- Persistence: needed for QoS 1 persistent sessions (clean session = false) and retained status ---
persistence true
persistence_location /mosquitto/data/

# --- Logging ---
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

# --- Access control ---
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# --- The only listener: MQTT over TLS. There is NO plaintext listener (no port 1883). ---
# TLS 1.2 or newer is the Mosquitto 2.x default, so tls_version is intentionally not set.
listener 8883
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
require_certificate false
