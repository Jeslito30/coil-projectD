# Team Dashboard v1 next to an EXISTING stack that was not started from this repository
# (e.g. coil-checkin2). It only joins that stack's Docker network to reach "influxdb"; it does not
# recreate, stop or reconfigure any existing container. Run from the repository root:
#
#   LIVE_NETWORK=<network of the influxdb container> INFLUX_ORG=<org> INFLUX_DASHBOARD_TOKEN=<read-only token> \
#     docker compose -p projectd-dashboard -f team-dashboard/compose.live.yml up -d
#
# Steps for the live host: team-dashboard/README.md. Uses a separate project name on purpose,
# so "up"/"down" here can never touch the coil-checkin2 project.
name: projectd-dashboard

services:
  team-dashboard:
    image: python:3.12-alpine
    restart: unless-stopped
    command: ["python", "/app/server.py"]
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "10.66.0.1:8088:8088"
      - "127.0.0.1:18088:8088"
    environment:
      INFLUX_URL: ${INFLUX_URL:-http://influxdb:8086}
      INFLUX_ORG: ${INFLUX_ORG:?set INFLUX_ORG (the org of the running InfluxDB)}
      INFLUX_TOKEN: ${INFLUX_DASHBOARD_TOKEN:?create a read-only token, see team-dashboard/README.md}
      INFLUX_BUCKET: ${INFLUX_BUCKET:-sensors}
      INFLUX_MEASUREMENT: ${INFLUX_MEASUREMENT:-environment}
      VALUE_FIELD: ${VALUE_FIELD:-value}
      DELAY_FIELD: ${DELAY_FIELD:-delay_ms}
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./:/app:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [live]

  # Optional push-only public mirror (README "Public mirror"). Start with: --profile public-mirror
  public-mirror:
    image: python:3.12-alpine
    profiles: ["public-mirror"]
    restart: unless-stopped
    command: ["python", "/app/publish_b2.py"]
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      INFLUX_URL: ${INFLUX_URL:-http://influxdb:8086}
      INFLUX_ORG: ${INFLUX_ORG:?set INFLUX_ORG}
      INFLUX_TOKEN: ${INFLUX_DASHBOARD_TOKEN:?create a read-only token, see team-dashboard/README.md}
      INFLUX_BUCKET: ${INFLUX_BUCKET:-sensors}
      INFLUX_MEASUREMENT: ${INFLUX_MEASUREMENT:-environment}
      VALUE_FIELD: ${VALUE_FIELD:-value}
      DELAY_FIELD: ${DELAY_FIELD:-delay_ms}
      B2_KEY_ID: ${MIRROR_B2_KEY_ID:-}
      B2_APP_KEY: ${MIRROR_B2_APP_KEY:-}
      B2_BUCKET: ${MIRROR_B2_BUCKET:-}
      PUBLISH_INTERVAL: ${MIRROR_INTERVAL:-60}
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./:/app:ro
    networks: [live]

networks:
  live:
    external: true
    name: ${LIVE_NETWORK:?set LIVE_NETWORK to the Docker network of the influxdb container}
