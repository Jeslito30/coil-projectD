apiVersion: 1

datasources:
  - name: COIL InfluxDB
    uid: coil-influx
    type: influxdb
    access: proxy
    url: $INFLUX_URL
    isDefault: true
    editable: false
    jsonData:
      version: Flux
      organization: $INFLUX_ORG
      defaultBucket: sensors
      tlsSkipVerify: false
    secureJsonData:
      token: $INFLUX_TOKEN
