name: Offline tests and configuration checks

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs (tags can be moved); the comment names the release.
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install YAML parser
        run: python -m pip install PyYAML==6.0.2

      - name: Run simulator contract tests
        run: python -m unittest discover -s simulators/tests -v

      - name: Scan the working tree for secrets (gitleaks)
        # Scans the files in this commit, not history: old commits contain reviewed false positives.
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSLO "$base/$tarball"
          curl -fsSL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " ${tarball}\$" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          ./gitleaks dir "$GITHUB_WORKSPACE" --config "$GITHUB_WORKSPACE/.gitleaks.toml" --redact --no-banner --verbose --exit-code 1

      - name: Check published ports and firewall allow list
        run: python -m unittest tests/security/test_compose_bindings.py -v

      - name: Run Grafana tooling tests
        run: python -m unittest discover -s tests/grafana -v

      - name: Run Telegraf registry-check tests
        run: python -m unittest discover -s tests/telegraf -v

      - name: Run InfluxDB scoped-token tests
        run: python -m unittest discover -s tests/influx -v

      - name: Run Wake-on-LAN relay tests
        run: python -m unittest discover -s wol-relay/tests -v

      - name: Compile Python sources
        run: python -m compileall -q simulators tests grafana deployment wol-relay

      - name: Validate JSON and YAML files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          json_files = sorted(Path('.').rglob('*.json'))
          yaml_files = sorted({
              *Path('deployment').rglob('*.yml'),
              *Path('deployment').rglob('*.yaml'),
              *Path('grafana').rglob('*.yml'),
              *Path('grafana').rglob('*.yaml'),
          })
          for path in json_files:
              with path.open(encoding='utf-8') as handle:
                  json.load(handle)
              print(f'JSON OK: {path}')
          for path in yaml_files:
              with path.open(encoding='utf-8') as handle:
                  list(yaml.safe_load_all(handle))
              print(f'YAML OK: {path}')
          if not json_files or not yaml_files:
              raise SystemExit('Expected configuration files were not found')
          PY

      - name: Check shell script syntax
        run: git ls-files -z '*.sh' | xargs -0 -n1 bash -n

      - name: Test the VPN firewall script with real packets (network namespaces)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq socat iproute2
          sudo tests/security/firewall-netns-test.sh

      - name: Validate Compose configuration without starting services
        # Throw-away random values generated per run, so no credential-looking literal is stored in Git.
        run: |
          for name in INFLUX_ADMIN_PASSWORD INFLUX_TOKEN MQTT_TELEGRAF_PASSWORD GRAFANA_ADMIN_PASSWORD; do
            export "$name=$(openssl rand -hex 16)"
          done
          export INFLUX_ADMIN_USER=ci GRAFANA_ALERT_EMAIL=ci@example.invalid
          docker compose -f deployment/contabo/compose.yml config -q
