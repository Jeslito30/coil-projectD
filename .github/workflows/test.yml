name: Offline tests and configuration checks

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install YAML parser
        run: python -m pip install PyYAML==6.0.2

      - name: Run simulator contract tests
        run: python -m unittest discover -s simulators/tests -v

      - name: Run Grafana tooling tests
        run: python -m unittest discover -s tests/grafana -v

      - name: Compile Python sources
        run: python -m compileall -q simulators tests grafana deployment

      - name: Validate JSON and YAML files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          json_files = sorted(Path('.').rglob('*.json'))
          yaml_files = sorted({
              *Path('deployment').rglob('*.yml'),
              *Path('deployment').rglob('*.yaml'),
              *Path('grafana').rglob('*.yml'),
              *Path('grafana').rglob('*.yaml'),
          })
          for path in json_files:
              with path.open(encoding='utf-8') as handle:
                  json.load(handle)
              print(f'JSON OK: {path}')
          for path in yaml_files:
              with path.open(encoding='utf-8') as handle:
                  list(yaml.safe_load_all(handle))
              print(f'YAML OK: {path}')
          if not json_files or not yaml_files:
              raise SystemExit('Expected configuration files were not found')
          PY

      - name: Check shell script syntax
        run: git ls-files -z '*.sh' | xargs -0 -n1 bash -n

      - name: Test the VPN firewall script with real packets (network namespaces)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq socat iproute2
          sudo tests/security/firewall-netns-test.sh

      - name: Validate Compose configuration without starting services
        # Throw-away random values generated per run, so no credential-looking literal is stored in Git.
        run: |
          for name in INFLUX_ADMIN_PASSWORD INFLUX_TOKEN MQTT_TELEGRAF_PASSWORD GRAFANA_ADMIN_PASSWORD; do
            export "$name=$(openssl rand -hex 16)"
          done
          export INFLUX_ADMIN_USER=ci GRAFANA_ALERT_EMAIL=ci@example.invalid
          docker compose -f deployment/contabo/compose.yml config -q
