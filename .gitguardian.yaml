version: 2

# Exact non-secret placeholders only. Do not add real credentials here.
secret:
  ignored-matches:
    - name: Simulator password environment-variable name (Szczecin)
      match: MQTT_SZCZ_TEMP_01_PASSWORD
    - name: Simulator password environment-variable name (Mati)
      match: MQTT_MATI_AIR_01_PASSWORD
    - name: Compose required-variable placeholder for Telegraf
      match: ${MQTT_TELEGRAF_PASSWORD:?set MQTT_TELEGRAF_PASSWORD in .env}
    - name: Restore script required-variable placeholder for Restic
      match: ${RESTIC_PASSWORD:?set in restic.env}
