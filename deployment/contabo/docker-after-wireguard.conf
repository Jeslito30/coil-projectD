# systemd drop-in: start Docker only after WireGuard has created wg0 (10.66.0.1).
# Mosquitto and Grafana publish their ports on 10.66.0.1. If Docker starts first after a reboot,
# those containers fail with "cannot assign requested address" and stay down.
# Install:
#   sudo install -D -m 644 deployment/contabo/docker-after-wireguard.conf \
#        /etc/systemd/system/docker.service.d/after-wireguard.conf
#   sudo systemctl daemon-reload
#   systemctl show docker -p After | grep -q wg-quick@wg0 && echo OK
# Takes effect at the next Docker start; verify with a full reboot in a maintenance window.
[Unit]
After=wg-quick@wg0.service
Wants=wg-quick@wg0.service
