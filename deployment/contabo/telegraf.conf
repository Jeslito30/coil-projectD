# Project D: Mosquitto TLS -> Telegraf -> InfluxDB 2.x (sensors bucket).
# Environment variables are supplied by deployment/contabo/compose.yml and .env.
[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  flush_interval = "10s"
  hostname = "contabo-project-d"

[[inputs.mqtt_consumer]]
  servers = ["ssl://mosquitto:8883"]
  topics = [
    "coil/+/temperature/+",
    "coil/+/humidity/+",
    "coil/+/airquality/+",
  ]
  qos = 1
  client_id = "telegraf"         # the broker forces client ID = username (use_username_as_clientid)
  persistent_session = true
  username = "$MQTT_TELEGRAF_USERNAME"
  password = "$MQTT_TELEGRAF_PASSWORD"
  tls_ca = "/etc/telegraf/ca.crt"
  insecure_skip_verify = false
  connection_timeout = "10s"
  max_undelivered_messages = 2000
  data_format = "json_v2"
  topic_tag = "topic"            # used by the registry check below

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "environment"
    timestamp_path = "timestamp_utc"
    timestamp_format = "2006-01-02T15:04:05.000Z07:00"

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "sensor_id"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "city"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "sensor_type"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "value"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "seq"
      type = "int"

# Registry check, then delay. A reading is dropped (and logged) unless its MQTT topic, city,
# sensor_type and sensor_id all match one of the six registered sensors in documents/data-design.md.
# The broker ACL already limits each account to its own topic; this also stops a valid account from
# writing a different sensor_id, city or type into the payload, which would create new InfluxDB series.
# Delay = processing time minus source timestamp, in milliseconds. Clocks must use NTP.
[[processors.starlark]]
  namepass = ["environment"]
  source = '''
load("time.star", "time")
load("logging.star", "log")

# sensor_id: (JSON city, topic city, sensor_type)
SENSORS = {
    "MATI-TEMP-01": ("Mati", "mati", "temperature"),
    "MATI-HUM-01": ("Mati", "mati", "humidity"),
    "MATI-AIR-01": ("Mati", "mati", "airquality"),
    "SZCZ-TEMP-01": ("Szczecin", "szczecin", "temperature"),
    "SZCZ-HUM-01": ("Szczecin", "szczecin", "humidity"),
    "SZCZ-AIR-01": ("Szczecin", "szczecin", "airquality"),
}

def apply(metric):
    sensor_id = metric.tags.get("sensor_id", "")
    expected = SENSORS.get(sensor_id)
    if expected == None:
        log.warn("dropped reading: unregistered sensor_id %r on %r" % (sensor_id, metric.tags.get("topic", "")))
        return None
    city, topic_city, sensor_type = expected
    topic = "coil/%s/%s/%s" % (topic_city, sensor_type, sensor_id)
    if metric.tags.get("topic", "") != topic or metric.tags.get("city", "") != city or metric.tags.get("sensor_type", "") != sensor_type:
        log.warn("dropped reading: %s does not match topic/city/type (%r, %r, %r)" % (
            sensor_id, metric.tags.get("topic", ""), metric.tags.get("city", ""), metric.tags.get("sensor_type", "")))
        return None
    metric.fields["delay_ms"] = (time.now().unix_nano - metric.time) / 1000000.0
    return metric
'''

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "$INFLUX_TOKEN"
  organization = "$INFLUX_ORG"
  bucket = "sensors"
  timeout = "10s"
